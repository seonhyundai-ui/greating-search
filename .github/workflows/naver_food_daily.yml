name: NAVER Food Daily

on:
  schedule:
    # 09:30 KST = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      NAVER_SEARCH_2025_ID: ${{ secrets.NAVER_SEARCH_2025_ID }}
      NAVER_SEARCH_2026_ID: ${{ secrets.NAVER_SEARCH_2026_ID }}
      NAVER_SEARCH_2027_ID: ${{ secrets.NAVER_SEARCH_2027_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NAVER food daily collector
        run: python -m src.naver_food_to_sheets
